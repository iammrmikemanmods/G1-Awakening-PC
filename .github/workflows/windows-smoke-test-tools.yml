name: Windows executable smoke-test tools
on:
  push:
    branches: [build/updated-pc-executable]
    paths: [.github/workflows/windows-smoke-test-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Acquire packaged Wine tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          mkdir -p packages root metadata
          cd packages
          apt-get download wine64 libwine libpcap0.8t64 libgphoto2-6 libgphoto2-port12 libvkd3d1 libosmesa6 libunwind8
          sha256sum *.deb > ../metadata/debian-packages.sha256
          for package in *.deb; do dpkg-deb --field "$package" Package Version >> ../metadata/versions.txt; dpkg-deb --extract "$package" ../root; done
          cd ..
          printf '# Test-tool archive policy\nIsolated Wine x64 runtime for Windows smoke tests. Not part of the game distribution. Preserve upstream license notices.\n' > README_MEMORY_ZIP_POLICY.md
          # No font files are exported in this build-tools artifact.
          find root -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.fon' \) -delete
          tar -czf wine-smoke-tools.tar.gz root metadata README_MEMORY_ZIP_POLICY.md
          sha256sum wine-smoke-tools.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: G1-Windows-Smoke-Test-Tools
          path: |
            wine-smoke-tools.tar.gz
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
